<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Map Camera Official Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, -apple-system, sans-serif; }
    body { background: #0b0f17; color: #e2e8f0; padding: 12px; }
    .panel { background: #161e2e; border: 1px solid #293548; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    h2 { font-size: 16px; color: #38bdf8; text-align: center; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 90px; padding: 10px 6px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; width: 100%; padding: 14px; font-size: 15px; margin-top: 10px; }
    .btn-sub { background: #1f293d; color: #93c5fd; border: 1px solid #3b82f6; }
    .btn-dark { background: #334155; color: #f8fafc; }
    label { font-size: 11px; color: #94a3b8; display: block; margin-top: 6px; margin-bottom: 2px; }
    input, select { width: 100%; background: #0a0d14; border: 1px solid #334155; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }
    #canvas-wrap { width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-top: 10px; border: 1px solid #334155; }
    canvas { width: 100%; display: block; height: auto; }
    #videoPreview { width: 100%; display: none; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>📍 GPS Map Camera Official Studio</h2>

    <div class="row">
      <label class="btn btn-primary" style="cursor: pointer; margin: 0;">
        📁 Gallery Photo
        <input type="file" id="uploadInput" accept="image/*" style="display: none;">
      </label>
      <button class="btn btn-sub" onclick="startCamera()">📷 Live Camera</button>
      <button class="btn btn-sub" onclick="captureLiveGPS()">📡 Live GPS</button>
    </div>

    <video id="videoPreview" autoplay playsinline></video>
    <button id="snapBtn" class="btn btn-primary" style="display: none; width: 100%; margin-bottom: 10px;" onclick="snapCamera()">📸 Photo Click Karein</button>

    <label>City & State (Indian Flag Auto):</label>
    <input type="text" id="inLoc" value="Jhanjheri, Punjab, India">

    <label>Street / Plus Code Address:</label>
    <input type="text" id="inSubLoc" value="Sh12a, Jhanjheri, Punjab 140307, India">

    <label>Latitude & Longitude:</label>
    <input type="text" id="inCoords" value="Lat 30.680929° Long 76.606903°">

    <label>Date & Time Stamp:</label>
    <input type="text" id="inTime" value="Tuesday, 03/11/2026 05:17 PM GMT +05:30">

    <div class="row">
      <button class="btn btn-primary" onclick="setLiveCurrentTime()">⏰ Set Abhi Ka Time</button>
      <button class="btn btn-dark" onclick="adjustTime(-15)">-15m</button>
      <button class="btn btn-dark" onclick="adjustTime(15)">+15m</button>
      <button class="btn btn-dark" onclick="adjustHours(-1)">-1 Hr</button>
      <button class="btn btn-dark" onclick="adjustHours(1)">+1 Hr</button>
    </div>

    <label>Stamp Background Opacity:</label>
    <select id="bgOpacity" onchange="drawStamp()">
      <option value="0.75">Default 75% Translucent (Original)</option>
      <option value="1.0">100% Solid Dark (Purana Stamp Chhupane Ke Liye)</option>
      <option value="0.88">88% High Contrast</option>
    </select>

    <button class="btn btn-green" onclick="downloadImage()">💾 Download Clean Photo (HD)</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="mainCanvas"></canvas>
  </div>

  <script>
    let loadedImg = null;
    let videoStream = null;
    let activeDate = new Date();
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // Indian Flag SVG
    const flagSvg = new Image();
    flagSvg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="60" viewBox="0 0 900 600">
        <rect width="900" height="200" fill="#FF9933"/>
        <rect width="900" height="200" y="200" fill="#FFFFFF"/>
        <rect width="900" height="200" y="400" fill="#138808"/>
        <circle cx="450" cy="300" r="80" fill="none" stroke="#000080" stroke-width="14"/>
        <circle cx="450" cy="300" r="16" fill="#000080"/>
      </svg>
    `);

    // High detail realistic satellite ground image
    const satCanvas = document.createElement('canvas');
    satCanvas.width = 400; satCanvas.height = 400;
    const sctx = satCanvas.getContext('2d');
    
    // Natural satellite field base
    const grad = sctx.createLinearGradient(0, 0, 400, 400);
    grad.addColorStop(0, '#535b49');
    grad.addColorStop(0.35, '#6a755d');
    grad.addColorStop(0.7, '#485040');
    grad.addColorStop(1, '#333b2e');
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, 400, 400);

    // Trees / Ground patches
    sctx.fillStyle = "#3f4736";
    sctx.beginPath();
    sctx.arc(80, 290, 60, 0, Math.PI * 2);
    sctx.arc(140, 310, 50, 0, Math.PI * 2);
    sctx.fill();

    // Road / Track
    sctx.strokeStyle = "#8b9480";
    sctx.lineWidth = 18;
    sctx.beginPath();
    sctx.moveTo(0, 160); sctx.lineTo(400, 155);
    sctx.moveTo(170, 0); sctx.lineTo(175, 400);
    sctx.stroke();

    // Concrete compounds & roofs
    sctx.fillStyle = "#9ba592";
    sctx.fillRect(75, 55, 80, 65);
    sctx.fillStyle = "#293444"; // Blue tinted roof
    sctx.fillRect(95, 175, 125, 95);
    sctx.fillStyle = "#7c8574";
    sctx.fillRect(205, 60, 130, 80);

    // Placeholder image
    const initialImg = new Image();
    initialImg.crossOrigin = "anonymous";
    initialImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
        <rect width="900" height="1200" fill="#1e293b"/>
        <text x="50%" y="48%" fill="#94a3b8" font-size="34" font-family="sans-serif" text-anchor="middle">Gallery Photo Chunein Ya Camera Kholein</text>
      </svg>
    `);
    initialImg.onload = () => { loadedImg = initialImg; drawStamp(); };

    document.getElementById('uploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => { loadedImg = img; drawStamp(); };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    ['inLoc', 'inSubLoc', 'inCoords', 'inTime'].forEach(id => {
      document.getElementById(id).addEventListener('input', drawStamp);
    });

    async function startCamera() {
      const vid = document.getElementById('videoPreview');
      const snap = document.getElementById('snapBtn');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        vid.srcObject = videoStream;
        vid.style.display = 'block';
        snap.style.display = 'block';
      } catch (err) {
        alert("Camera permission allow karein.");
      }
    }

    function snapCamera() {
      const vid = document.getElementById('videoPreview');
      const tmp = document.createElement('canvas');
      tmp.width = vid.videoWidth || 1080;
      tmp.height = vid.videoHeight || 1440;
      tmp.getContext('2d').drawImage(vid, 0, 0);
      const img = new Image();
      img.onload = () => {
        loadedImg = img;
        drawStamp();
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        vid.style.display = 'none';
        document.getElementById('snapBtn').style.display = 'none';
      };
      img.src = tmp.toDataURL('image/jpeg');
    }

    function captureLiveGPS() {
      if (!navigator.geolocation) return alert("Geolocation not supported");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lon = pos.coords.longitude.toFixed(6);
        document.getElementById('inCoords').value = `Lat ${lat}° Long ${lon}°`;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
          const data = await res.json();
          if (data && data.address) {
            const a = data.address;
            const city = a.city || a.town || a.village || a.suburb || "Mohali";
            const state = a.state || "Punjab";
            const country = a.country || "India";
            const road = a.road || "Sh12a";
            const post = a.postcode || "140307";
            document.getElementById('inLoc').value = `${city}, ${state}, ${country}`;
            document.getElementById('inSubLoc').value = `${road}, ${city}, ${state} ${post}, ${country}`;
          }
        } catch(e){}
        drawStamp();
      }, () => alert("GPS location permission allow karein."));
    }

    function formatCustomDate(d) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const dName = days[d.getDay()];
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      let hours = d.getHours();
      const mins = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const hh = String(hours).padStart(2, '0');
      return `${dName}, ${dd}/${mm}/${yyyy} ${hh}:${mins} ${ampm} GMT +05:30`;
    }

    function setLiveCurrentTime() {
      activeDate = new Date();
      document.getElementById('inTime').value = formatCustomDate(activeDate);
      drawStamp();
    }

    function adjustTime(mins) {
      activeDate.setMinutes(activeDate.getMinutes() + mins);
      document.getElementById('inTime').value = formatCustomDate(activeDate);
      drawStamp();
    }

    function adjustHours(hrs) {
      activeDate.setHours(activeDate.getHours() + hrs);
      document.getElementById('inTime').value = formatCustomDate(activeDate);
      drawStamp();
    }

    // Function to draw official crisp GPS Map Camera Top-Right Badge
    function drawOfficialAppBadge(x, y, h) {
      const iconSize = Math.round(h * 0.92);
      ctx.save();
      
      // Pill container
      ctx.font = `bold ${Math.round(h * 0.52)}px -apple-system, Roboto, sans-serif`;
      const txt = "GPS Map Camera";
      const txtW = ctx.measureText(txt).width;
      const pillW = iconSize + txtW + Math.round(h * 0.6);
      const pillH = h;
      const pillX = x - pillW;

      ctx.fillStyle = "rgba(0, 0, 0, 0.60)";
      ctx.beginPath();
      ctx.roundRect(pillX, y, pillW, pillH, 5);
      ctx.fill();

      // App Icon Squircle
      const ix = pillX + Math.round(h * 0.12);
      const iy = y + Math.round((pillH - iconSize) / 2);
      
      // Blue base
      ctx.fillStyle = "#0284c7";
      ctx.beginPath();
      ctx.roundRect(ix, iy, iconSize, iconSize, iconSize * 0.22);
      ctx.fill();

      // Inner camera dark lens body
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.roundRect(ix + iconSize*0.12, iy + iconSize*0.12, iconSize*0.76, iconSize*0.76, iconSize*0.18);
      ctx.fill();

      // Cyan outer lens ring
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(ix + iconSize/2, iy + iconSize/2, iconSize*0.28, 0, Math.PI*2);
      ctx.fill();

      // Yellow aperture
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.arc(ix + iconSize/2, iy + iconSize/2, iconSize*0.19, 0, Math.PI*2);
      ctx.fill();

      // Glare dot
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ix + iconSize*0.42, iy + iconSize*0.42, iconSize*0.06, 0, Math.PI*2);
      ctx.fill();

      // Green sensor dot
      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.arc(ix + iconSize*0.74, iy + iconSize*0.26, iconSize*0.06, 0, Math.PI*2);
      ctx.fill();

      // Text "GPS Map Camera"
      ctx.fillStyle = "#ffffff";
      ctx.fillText(txt, ix + iconSize + Math.round(h * 0.18), y + (pillH * 0.70));

      ctx.restore();
    }

    function drawStamp() {
      if (!loadedImg) return;
      const w = loadedImg.naturalWidth || loadedImg.width;
      const h = loadedImg.naturalHeight || loadedImg.height;
      canvas.width = w;
      canvas.height = h;

      // 1. Draw Clean Base Photo
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(loadedImg, 0, 0, w, h);

      // 2. Official Bottom Banner Strip
      const bannerH = Math.round(h * 0.178);
      const bannerY = h - bannerH;
      const opacity = document.getElementById('bgOpacity').value;
      ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
      ctx.fillRect(0, bannerY, w, bannerH);

      // 3. Satellite Map Box
      const mapPad = Math.round(bannerH * 0.07);
      const mapSize = bannerH - (mapPad * 2);
      const mapX = mapPad;
      const mapY = bannerY + mapPad;

      ctx.save();
      ctx.beginPath();
      ctx.rect(mapX, mapY, mapSize, mapSize);
      ctx.clip();
      ctx.drawImage(satCanvas, mapX, mapY, mapSize, mapSize);
      ctx.restore();

      // Official Red Pin with 3D drop look
      const pinX = mapX + (mapSize / 2);
      const pinY = mapY + (mapSize * 0.44);
      const pinR = mapSize * 0.13;

      ctx.beginPath();
      ctx.arc(pinX, pinY, pinR, 0, Math.PI * 2);
      ctx.fillStyle = "#ea4335";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(pinX - pinR, pinY);
      ctx.lineTo(pinX + pinR, pinY);
      ctx.lineTo(pinX, pinY + (pinR * 1.6));
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pinX, pinY, pinR * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = "#b91c1c";
      ctx.fill();

      // Google Logo text at bottom left of the map
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(mapSize * 0.22)}px -apple-system, sans-serif`;
      ctx.fillText("Google", mapX + (mapSize * 0.08), mapY + mapSize - (mapSize * 0.10));

      // 4. Texts
      const textX = mapX + mapSize + Math.round(w * 0.024);
      const fs = Math.round(bannerH * 0.155);

      // Main City / Title
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(fs * 1.25)}px -apple-system, sans-serif`;
      const title = document.getElementById('inLoc').value;
      ctx.fillText(title, textX, bannerY + (bannerH * 0.23));

      // Indian Flag Alignment
      const titleW = ctx.measureText(title).width;
      const flagH = Math.round(fs * 0.95);
      const flagW = Math.round(flagH * 1.45);
      ctx.drawImage(flagSvg, textX + titleW + 12, bannerY + (bannerH * 0.23) - flagH + 2, flagW, flagH);

      // Detail Rows
      ctx.fillStyle = "#f8fafc";
      ctx.font = `400 ${fs}px -apple-system, sans-serif`;
      ctx.fillText(document.getElementById('inSubLoc').value, textX, bannerY + (bannerH * 0.43));
      ctx.fillText(document.getElementById('inCoords').value, textX, bannerY + (bannerH * 0.62));
      ctx.fillText(document.getElementById('inTime').value, textX, bannerY + (bannerH * 0.80));

      // Note Row
      ctx.fillStyle = "#cbd5e1";
      ctx.font = `400 ${Math.round(fs * 0.92)}px -apple-system, sans-serif`;
      ctx.fillText("Note : Captured by GPS Map Camera", textX, bannerY + (bannerH * 0.96));

      // 5. Official App Badge (Top Right above banner)
      const badgeH = Math.round(bannerH * 0.17);
      drawOfficialAppBadge(w - mapPad, bannerY - badgeH - 6, badgeH);
    }

    function downloadImage() {
      if (!loadedImg) return alert("Photo select karein!");
      const link = document.createElement('a');
      link.download = 'GPS_Camera_' + Date.now() + '.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.98);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
