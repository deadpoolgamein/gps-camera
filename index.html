<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Map Camera Official Studio</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, -apple-system, sans-serif; }
    body { background: #0b0f17; color: #e2e8f0; padding: 12px; }
    .panel { background: #161e2e; border: 1px solid #293548; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    h2 { font-size: 16px; color: #38bdf8; text-align: center; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 90px; padding: 10px 6px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; width: 100%; padding: 14px; font-size: 15px; margin-top: 10px; }
    .btn-sub { background: #1f293d; color: #93c5fd; border: 1px solid #3b82f6; }
    .btn-dark { background: #334155; color: #f8fafc; }
    label { font-size: 11px; color: #94a3b8; display: block; margin-top: 6px; margin-bottom: 2px; }
    input, select { width: 100%; background: #0a0d14; border: 1px solid #334155; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }
    #interactiveMap { width: 100%; height: 210px; border-radius: 8px; margin: 8px 0 12px 0; border: 1px solid #38bdf8; }
    #canvas-wrap { width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-top: 10px; border: 1px solid #334155; }
    canvas { width: 100%; display: block; height: auto; }
    #videoPreview { width: 100%; display: none; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>📍 GPS Map Camera Official Studio</h2>

    <div class="row">
      <label class="btn btn-primary" style="cursor: pointer; margin: 0;">
        📁 Gallery Photo
        <input type="file" id="uploadInput" accept="image/*" style="display: none;">
      </label>
      <button class="btn btn-sub" onclick="startCamera()">📷 Live Camera</button>
      <button class="btn btn-sub" onclick="captureLiveGPS()">📡 Live GPS</button>
    </div>

    <video id="videoPreview" autoplay playsinline></video>
    <button id="snapBtn" class="btn btn-primary" style="display: none; width: 100%; margin-bottom: 10px;" onclick="snapCamera()">📸 Photo Click Karein</button>

    <label style="color: #38bdf8; font-weight: bold;">👇 Draggable Map Pin (Pin ko khinch kar kahin bhi rakhein):</label>
    <div id="interactiveMap"></div>

    <label>City & State (Indian Flag Auto):</label>
    <input type="text" id="inLoc" value="Kharar, Punjab, India">

    <label>Street / Plus Code Address:</label>
    <input type="text" id="inSubLoc" value="Sh12a, Kharar, Punjab 140301, India">

    <label>Latitude & Longitude:</label>
    <input type="text" id="inCoords" value="Lat 30.738888° Long 76.662292°">

    <label>Date & Time Stamp:</label>
    <input type="text" id="inTime" value="Thursday, 05/11/2026 08:04 PM GMT +05:30">

    <div class="row">
      <button class="btn btn-primary" onclick="setLiveCurrentTime()">⏰ Set Abhi Ka Time</button>
      <button class="btn btn-dark" onclick="adjustTime(-15)">-15m</button>
      <button class="btn btn-dark" onclick="adjustTime(15)">+15m</button>
      <button class="btn btn-dark" onclick="adjustHours(-1)">-1 Hr</button>
      <button class="btn btn-dark" onclick="adjustHours(1)">+1 Hr</button>
    </div>

    <label>Stamp Background Opacity:</label>
    <select id="bgOpacity" onchange="drawStamp()">
      <option value="0.75">Default 75% Translucent (Original)</option>
      <option value="1.0">100% Solid Dark (Purana Stamp Chhupane Ke Liye)</option>
      <option value="0.88">88% High Contrast</option>
    </select>

    <button class="btn btn-green" onclick="downloadImage()">💾 Download Clean Photo (HD)</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="mainCanvas"></canvas>
  </div>

  <script>
    let loadedImg = null;
    let videoStream = null;
    let activeDate = new Date();
    let currentLat = 30.738888;
    let currentLon = 76.662292;
    let satTileLoaded = false;
    let satTileImg = new Image();

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // Indian Flag SVG
    const flagSvg = new Image();
    flagSvg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="60" viewBox="0 0 900 600">
        <rect width="900" height="200" fill="#FF9933"/>
        <rect width="900" height="200" y="200" fill="#FFFFFF"/>
        <rect width="900" height="200" y="400" fill="#138808"/>
        <circle cx="450" cy="300" r="80" fill="none" stroke="#000080" stroke-width="14"/>
        <circle cx="450" cy="300" r="16" fill="#000080"/>
      </svg>
    `);

    // 1. Draggable Leaflet Interactive Map
    const map = L.map('interactiveMap', { zoomControl: true }).setView([currentLat, currentLon], 16);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Esri Satellite'
    }).addTo(map);

    const marker = L.marker([currentLat, currentLon], { draggable: true }).addTo(map);

    marker.on('dragend', function() {
      const pos = marker.getLatLng();
      updatePositionAndGeocode(pos.lat, pos.lng);
    });

    map.on('click', function(e) {
      marker.setLatLng(e.latlng);
      updatePositionAndGeocode(e.latlng.lat, e.latlng.lng);
    });

    async function updatePositionAndGeocode(lat, lon) {
      currentLat = lat;
      currentLon = lon;
      const latStr = lat.toFixed(6);
      const lonStr = lon.toFixed(6);
      document.getElementById('inCoords').value = `Lat ${latStr}° Long ${lonStr}°`;
      fetchStaticSatelliteImage(lat, lon);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latStr}&lon=${lonStr}&format=json`);
        const data = await res.json();
        if (data && data.address) {
          const a = data.address;
          const city = a.city || a.town || a.village || a.suburb || "Kharar";
          const state = a.state || "Punjab";
          const country = a.country || "India";
          const road = a.road || "Sh12a";
          const post = a.postcode || "140301";
          document.getElementById('inLoc').value = `${city}, ${state}, ${country}`;
          document.getElementById('inSubLoc').value = `${road}, ${city}, ${state} ${post}, ${country}`;
        }
      } catch(e){}
      drawStamp();
    }

    // 2. Real Satellite Tile Fetcher
    function lon2tile(lon, zoom) { return (Math.floor((lon + 180) / 360 * Math.pow(2, zoom))); }
    function lat2tile(lat, zoom) { return (Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom))); }

    function fetchStaticSatelliteImage(lat, lon) {
      const zoom = 16;
      const x = lon2tile(lon, zoom);
      const y = lat2tile(lat, zoom);
      
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        satTileImg = img;
        satTileLoaded = true;
        drawStamp();
      };
      img.onerror = function() {
        satTileLoaded = false;
        drawStamp();
      };
      // High-resolution Esri World Satellite Imagery server tile
      img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${y}/${x}`;
    }

    fetchStaticSatelliteImage(currentLat, currentLon);

    // Initial placeholder
    const initialImg = new Image();
    initialImg.crossOrigin = "anonymous";
    initialImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
        <rect width="900" height="1200" fill="#1e293b"/>
        <text x="50%" y="48%" fill="#94a3b8" font-size="34" font-family="sans-serif" text-anchor="middle">Gallery Photo Chunein Ya Camera Kholein</text>
      </svg>
    `);
    initialImg.onload = () => { loadedImg = initialImg; drawStamp(); };

    document.getElementById('uploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => { loadedImg = img; drawStamp(); };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    ['inLoc', 'inSubLoc', 'inCoords', 'inTime'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (id === 'inCoords') {
          const val = document.getElementById('inCoords').value;
          const match = val.match(/Lat\s*([\d\.\-]+).*?Long\s*([\d\.\-]+)/i);
          if (match) {
            currentLat = parseFloat(match[1]);
            currentLon = parseFloat(match[2]);
            map.setView([currentLat, currentLon], 16);
            marker.setLatLng([currentLat, currentLon]);
            fetchStaticSatelliteImage(currentLat, currentLon);
          }
        }
        drawStamp();
      });
    });

    async function startCamera() {
      const vid = document.getElementById('videoPreview');
      const snap = document.getElementById('snapBtn');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        vid.srcObject = videoStream;
        vid.style.display = 'block';
        snap.style.display = 'block';
      } catch (err) {
        alert("Camera permission allow karein.");
      }
    }

    function snapCamera() {
      const vid = document.getElementById('videoPreview');
      const tmp = document.createElement('canvas');
      tmp.width = vid.videoWidth || 1080;
      tmp.height = vid.videoHeight || 1440;
      tmp.getContext('2d').drawImage(vid, 0, 0);
      const img = new Image();
      img.onload = () => {
        loadedImg = img;
        drawStamp();
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        vid.style.display = 'none';
        document.getElementById('snapBtn').style.display = 'none';
      };
      img.src = tmp.toDataURL('image/jpeg');
    }

    function captureLiveGPS() {
      if (!navigator.geolocation) return alert("Geolocation not supported");
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 16);
        marker.setLatLng([lat, lon]);
        updatePositionAndGeocode(lat, lon);
      }, () => alert("GPS location permission allow karein."));
    }

    function formatCustomDate(d) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const dName = days[d.getDay()];
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      let hours = d.getHours();
      const mins = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const hh = String(hours).padStart(2, '0');
      return `${dName}, ${dd}/${mm}/${yyyy} ${hh}:${mins} ${ampm} GMT +05:30`;
    }

    function setLiveCurrentTime() {
      activeDate = new Date();
      document.getElementById('inTime').value = formatCustomDate(activeDate);
      drawStamp();
    }

    function adjustTime(mins) {
      activeDate.setMinutes(activeDate.getMinutes() + mins);
      document.getElementById('inTime').value = formatCustomDate(activeDate);
      drawStamp();
    }

    function adjustHours(hrs) {
      activeDate.setHours(activeDate.getHours() + hrs);
      document.getElementById('inTime').value = formatCustomDate(activeDate);
      drawStamp();
    }

    // 3. Exact Play Store Logo matching the user attachment
    function drawExactPlayStoreLogo(ix, iy, s) {
      ctx.save();
      
      // Outer Squircle
      ctx.beginPath();
      ctx.roundRect(ix, iy, s, s, s * 0.22);
      ctx.clip();

      // Sky Blue Gradient
      const skyGrad = ctx.createLinearGradient(ix, iy, ix, iy + s);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(0.60, '#7dd3fc');
      skyGrad.addColorStop(0.85, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(ix, iy, s, s);

      // Globe Grass & Ocean Bottom Curves
      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.arc(ix + s * 0.50, iy + s * 1.35, s * 0.65, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#3b82f6";
      ctx.beginPath();
      ctx.arc(ix + s * 0.25, iy + s * 0.90, s * 0.16, 0, Math.PI * 2);
      ctx.fill();

      // 4 White Viewfinder Brackets
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1.5, s * 0.05);
      ctx.lineCap = "round";
      const pad = s * 0.11;
      const arm = s * 0.16;

      ctx.beginPath();
      ctx.moveTo(ix + pad, iy + pad + arm);
      ctx.lineTo(ix + pad, iy + pad);
      ctx.lineTo(ix + pad + arm, iy + pad);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(ix + s - pad - arm, iy + pad);
      ctx.lineTo(ix + s - pad, iy + pad);
      ctx.lineTo(ix + s - pad, iy + pad + arm);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(ix + pad, iy + s - pad - arm);
      ctx.lineTo(ix + pad, iy + s - pad);
      ctx.lineTo(ix + pad + arm, iy + s - pad);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(ix + s - pad - arm, iy + s - pad);
      ctx.lineTo(ix + s - pad, iy + s - pad);
      ctx.lineTo(ix + s - pad, iy + s - pad - arm);
      ctx.stroke();

      // Golden Aperture Ring
      const cx = ix + s / 2;
      const cy = iy + s * 0.44;
      const r = s * 0.28;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = "#facc15";
      ctx.fill();

      // Inner Lens Body
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.80, 0, Math.PI * 2);
      ctx.fillStyle = "#1e293b";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.48, 0, Math.PI * 2);
      ctx.fillStyle = "#090d16";
      ctx.fill();

      // Lens Glare Spot
      ctx.beginPath();
      ctx.arc(cx + r * 0.35, cy - r * 0.35, r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // Mini-Banner Overlay
      const mW = s * 0.74;
      const mH = s * 0.16;
      const mX = ix + (s - mW) / 2;
      const mY = iy + s * 0.72;

      ctx.fillStyle = "rgba(0, 0, 0, 0.90)";
      ctx.fillRect(mX, mY, mW, mH);

      ctx.fillStyle = "#86efac";
      ctx.fillRect(mX + 1.5, mY + 1.5, mH - 3, mH - 3);

      ctx.fillStyle = "#f97316";
      ctx.fillRect(mX + mH + 2, mY + 2.5, mW - mH - 5, 2.5);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(mX + mH + 2, mY + 6, mW - mH - 5, 2);

      ctx.restore();
    }

    function drawStamp() {
      if (!loadedImg) return;
      const w = loadedImg.naturalWidth || loadedImg.width;
      const h = loadedImg.naturalHeight || loadedImg.height;
      canvas.width = w;
      canvas.height = h;

      // 1. Base Image
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(loadedImg, 0, 0, w, h);

      // 2. Translucent Bottom Banner
      const bannerH = Math.round(h * 0.178);
      const bannerY = h - bannerH;
      const opacity = document.getElementById('bgOpacity').value;
      ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
      ctx.fillRect(0, bannerY, w, bannerH);

      // 3. Real Satellite Map Box
      const mapPad = Math.round(bannerH * 0.07);
      const mapSize = bannerH - (mapPad * 2);
      const mapX = mapPad;
      const mapY = bannerY + mapPad;

      ctx.save();
      ctx.beginPath();
      ctx.rect(mapX, mapY, mapSize, mapSize);
      ctx.clip();
      
      if (satTileLoaded && satTileImg.naturalWidth > 0) {
        ctx.drawImage(satTileImg, mapX, mapY, mapSize, mapSize);
      } else {
        // Fallback natural green aerial gradient if network is slow
        const g = ctx.createLinearGradient(mapX, mapY, mapX + mapSize, mapY + mapSize);
        g.addColorStop(0, '#535b49');
        g.addColorStop(1, '#333b2e');
        ctx.fillStyle = g;
        ctx.fillRect(mapX, mapY, mapSize, mapSize);
      }
      ctx.restore();

      // Red Drop Pin with Shadow
      const pinX = mapX + (mapSize / 2);
      const pinY = mapY + (mapSize * 0.44);
      const pinR = mapSize * 0.13;

      ctx.beginPath();
      ctx.arc(pinX, pinY, pinR, 0, Math.PI * 2);
      ctx.fillStyle = "#ea4335";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(pinX - pinR, pinY);
      ctx.lineTo(pinX + pinR, pinY);
      ctx.lineTo(pinX, pinY + (pinR * 1.6));
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pinX, pinY, pinR * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = "#b91c1c";
      ctx.fill();

      // Google Logo
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(mapSize * 0.22)}px -apple-system, sans-serif`;
      ctx.fillText("Google", mapX + (mapSize * 0.08), mapY + mapSize - (mapSize * 0.10));

      // 4. Texts
      const textX = mapX + mapSize + Math.round(w * 0.024);
      const fs = Math.round(bannerH * 0.155);

      // Main City / Title
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.round(fs * 1.25)}px -apple-system, sans-serif`;
      const title = document.getElementById('inLoc').value;
      ctx.fillText(title, textX, bannerY + (bannerH * 0.23));

      // Indian Flag
      const titleW = ctx.measureText(title).width;
      const flagH = Math.round(fs * 0.95);
      const flagW = Math.round(flagH * 1.45);
      ctx.drawImage(flagSvg, textX + titleW + 12, bannerY + (bannerH * 0.23) - flagH + 2, flagW, flagH);

      // Info Rows
      ctx.fillStyle = "#f8fafc";
      ctx.font = `400 ${fs}px -apple-system, sans-serif`;
      ctx.fillText(document.getElementById('inSubLoc').value, textX, bannerY + (bannerH * 0.43));
      ctx.fillText(document.getElementById('inCoords').value, textX, bannerY + (bannerH * 0.62));
      ctx.fillText(document.getElementById('inTime').value, textX, bannerY + (bannerH * 0.80));

      // Note Row
      ctx.fillStyle = "#cbd5e1";
      ctx.font = `400 ${Math.round(fs * 0.92)}px -apple-system, sans-serif`;
      ctx.fillText("Note : Captured by GPS Map Camera", textX, bannerY + (bannerH * 0.96));

      // 5. Official App Badge with Attached Logo (Top Right)
      const badgeH = Math.round(bannerH * 0.17);
      const logoSize = Math.round(badgeH * 0.88);
      
      ctx.font = `bold ${Math.round(badgeH * 0.52)}px -apple-system, Roboto, sans-serif`;
      const badgeText = "GPS Map Camera";
      const badgeTextW = ctx.measureText(badgeText).width;
      const pillW = logoSize + badgeTextW + Math.round(badgeH * 0.55);
      const pillH = badgeH;
      const pillX = w - mapPad - pillW;
      const pillY = bannerY - pillH - 6;

      ctx.fillStyle = "rgba(0, 0, 0, 0.60)";
      ctx.beginPath();
      ctx.roundRect(pillX, pillY, pillW, pillH, 5);
      ctx.fill();

      // Draw Exact Play Store Logo
      drawExactPlayStoreLogo(pillX + Math.round(badgeH * 0.08), pillY + Math.round((pillH - logoSize) / 2), logoSize);

      ctx.fillStyle = "#ffffff";
      ctx.fillText(badgeText, pillX + logoSize + Math.round(badgeH * 0.18), pillY + (pillH * 0.70));
    }

    function downloadImage() {
      if (!loadedImg) return alert("Photo select karein!");
      const link = document.createElement('a');
      link.download = 'GPS_Camera_' + Date.now() + '.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.98);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
